# Configuração de Benchmark para VectorDBBench
# Testes para pgvector, OpenSearch e Elasticsearch
# Datasets: 50K, 500K, 1M, 5M, 10M vetores

# ============================================================
# PGVECTOR - Testes com HNSW (índice mais popular)
# ============================================================
pgvectorhnsw:
  # Teste 1: Dataset pequeno - 50K vetores (OpenAI 1536 dim)
  # Uso: Validação rápida, desenvolvimento
  - db_label: pgvector-50k-hnsw
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance1536D50K
    k: 100
    m: 16
    ef_construction: 128
    ef_search: 128
    maintenance_work_mem: "4GB"
    max_parallel_workers: 4
    num_concurrency: "1,5,10,20"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 2: Dataset médio - 500K vetores (OpenAI 1536 dim)
  # Uso: Benchmark padrão
  - db_label: pgvector-500k-hnsw
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance1536D500K
    k: 100
    m: 16
    ef_construction: 200
    ef_search: 100
    maintenance_work_mem: "8GB"
    max_parallel_workers: 8
    num_concurrency: "1,10,20,40"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 3: Dataset médio - 1M vetores (Cohere 768 dim)
  # Uso: Benchmark padrão
  - db_label: pgvector-1m-hnsw
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 200
    ef_search: 100
    maintenance_work_mem: "16GB"
    max_parallel_workers: 8
    num_concurrency: "1,10,20,40,60"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 4: Dataset grande - 5M vetores (OpenAI 1536 dim)
  # Uso: Teste de capacidade
  - db_label: pgvector-5m-hnsw
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance1536D5M
    k: 100
    m: 16
    ef_construction: 256
    ef_search: 128
    maintenance_work_mem: "32GB"
    max_parallel_workers: 16
    num_concurrency: "1,10,20,40,60,80"
    concurrency_duration: 60
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 5: Dataset grande - 10M vetores (Cohere 768 dim)
  # Uso: Teste de capacidade máxima
  - db_label: pgvector-10m-hnsw
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance768D10M
    k: 100
    m: 16
    ef_construction: 256
    ef_search: 128
    maintenance_work_mem: "64GB"
    max_parallel_workers: 16
    num_concurrency: "1,10,20,40,60,80"
    concurrency_duration: 60
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 6: Quantização Binária (Bit) - Mais rápido e compacto
  # Uso: Comparação de performance com quantização
  - db_label: pgvector-1m-hnsw-bit
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 128
    ef_search: 128
    quantization_type: bit
    table_quantization_type: bit
    reranking: true
    reranking_metric: COSINE
    quantized_fetch_limit: 128
    maintenance_work_mem: "16GB"
    max_parallel_workers: 8
    num_concurrency: "1,10,20,40"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 7: Halfvec (FP16) - Economia de memória
  - db_label: pgvector-1m-hnsw-halfvec
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 128
    ef_search: 100
    quantization_type: halfvec
    table_quantization_type: halfvec
    maintenance_work_mem: "16GB"
    max_parallel_workers: 8
    num_concurrency: "1,10,20,40"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 8: IVFFlat - Alternativa ao HNSW
  - db_label: pgvector-1m-ivfflat
    user_name: ${PG_USER:-postgres}
    password: ${PG_PASSWORD:-postgres}
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5432}
    db_name: ${PG_DB:-vectordb}
    case_type: Performance768D1M
    k: 100
    lists: 1000
    probes: 10
    quantization_type: none
    maintenance_work_mem: "16GB"
    max_parallel_workers: 8
    num_concurrency: "1,10,20,40"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

# ============================================================
# ELASTICSEARCH - Testes com diferentes quantizações
# ============================================================
elasticcloudhnsw:
  # Teste 1: HNSW Padrão - 50K vetores
  - db_label: elastic-50k-hnsw
    cloud_id: ${ES_CLOUD_ID:-}
    host: ${ES_HOST:-localhost}
    port: ${ES_PORT:-9200}
    scheme: ${ES_SCHEME:-https}
    user: ${ES_USER:-elastic}
    password: ${ES_PASSWORD:-changeme}
    case_type: Performance1536D50K
    k: 100
    m: 16
    ef_construction: 100
    num_candidates: 100
    element_type: float
    number_of_shards: 1
    number_of_replicas: 0
    refresh_interval: "30s"
    merge_max_thread_count: 8
    use_force_merge: true
    use_routing: false
    use_rescore: false
    oversample_ratio: 2.0
    num_concurrency: "1,5,10,20"
    concurrency_duration: 30
    drop_old: true
