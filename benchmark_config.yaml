# ============================================================
# OPENSEARCH - Testes OSS (self-hosted)
# ============================================================
ossopensearch:
  # Teste 1: HNSW - 50K vetores
  - db_label: opensearch-50k-hnsw
    host: ${OS_HOST:-localhost}
    port: ${OS_PORT:-9200}
    user: ${OS_USER:-admin}
    password: ${OS_PASSWORD:-admin}
    case_type: Performance1536D50K
    k: 100
    m: 16
    ef_construction: 200
    ef_search: 100
    engine: faiss
    quantization_type: fp32
    number_of_shards: 1
    number_of_replicas: 0
    index_thread_qty: 4
    refresh_interval: "30s"
    force_merge_enabled: true
    num_concurrency: "1,5,10,20"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 2: HNSW - 1M vetores
  - db_label: opensearch-1m-hnsw
    host: ${OS_HOST:-localhost}
    port: ${OS_PORT:-9200}
    user: ${OS_USER:-admin}
    password: ${OS_PASSWORD:-admin}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 200
    ef_search: 100
    engine: faiss
    quantization_type: fp32
    number_of_shards: 1
    number_of_replicas: 0
    index_thread_qty: 4
    number_of_indexing_clients: 4
    refresh_interval: "30s"
    force_merge_enabled: true
    num_concurrency: "1,10,20,40,60"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 3: HNSW com Binary Quantization (BQ)
