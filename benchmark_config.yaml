    port: ${OS_PORT:-9200}
    user: ${OS_USER:-admin}
    password: ${OS_PASSWORD:-admin}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 256
    ef_search: 128
    engine: faiss
    quantization_type: bq
    ondisk: true
    number_of_shards: 1
    number_of_replicas: 0
    index_thread_qty: 4
    number_of_indexing_clients: 4
    refresh_interval: "30s"
    force_merge_enabled: true
    num_concurrency: "1,10,20,40,60"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 4: Lucene Engine (alternativa ao FAISS)
  - db_label: opensearch-1m-lucene
    host: ${OS_HOST:-localhost}
    port: ${OS_PORT:-9200}
    user: ${OS_USER:-admin}
    password: ${OS_PASSWORD:-admin}
    case_type: Performance768D1M
    k: 100
    m: 16
    ef_construction: 256
    ef_search: 128
    engine: lucene
    quantization_type: fp32
    number_of_shards: 1
    number_of_replicas: 0
    index_thread_qty: 4
    number_of_indexing_clients: 4
    refresh_interval: "30s"
    force_merge_enabled: true
    num_concurrency: "1,10,20,40,60"
    concurrency_duration: 30
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true

  # Teste 5: Dataset grande - 5M vetores
  - db_label: opensearch-5m-hnsw
    host: ${OS_HOST:-localhost}
    port: ${OS_PORT:-9200}
    user: ${OS_USER:-admin}
    password: ${OS_PASSWORD:-admin}
    case_type: Performance1536D5M
    k: 100
    m: 16
    ef_construction: 256
    ef_search: 128
    engine: faiss
    quantization_type: fp32
    number_of_shards: 3
    number_of_replicas: 0
