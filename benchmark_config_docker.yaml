# ============================================================
# CONFIGURACAO VECTORDBENCH - Docker Benchmark
# Arquivo de configuracao YAML para benchmarks com containers
# do banco-de-dados-jurisprudencia
# ============================================================
#
# USO ALTERNATIVO (o script run_benchmarks_sequential.sh passa
# parametros via CLI, mas este arquivo pode ser usado manualmente):
#
#   vectordbbench pgvectorhnsw --config-file benchmark_config_docker.yaml
#
# ============================================================

# -----------------------------------------------------------
# DATASET: 50K VETORES (Performance1536D50K)
# Rapido (~5 min) - Ideal para testes iniciais
# -----------------------------------------------------------
pgvectorhnsw-50k:
  db_label: pgvector_50k_docker
  user_name: postgres
  password: postgres
  host: localhost
  port: 5434
  db_name: psql_jurisprudencia
  case_type: Performance1536D50K
  k: 100
  m: 16
  ef_construction: 128
  ef_search: 128
  maintenance_work_mem: "4GB"
  max_parallel_workers: 4
  num_concurrency: "1,5,10,20"
  concurrency_duration: 30
  drop_old: true
  load: true
  search_serial: true
  search_concurrent: true

elasticcloudhnsw-50k:
  db_label: es_50k_docker
  host: localhost
  port: 9201
  scheme: http
  user: elastic
  password: ""
  case_type: Performance1536D50K
  k: 100
  m: 16
  ef_construction: 100
  num_candidates: 100
  element_type: float
  number_of_shards: 1
  number_of_replicas: 0
  refresh_interval: "30s"
  merge_max_thread_count: 8
  use_force_merge: true
  use_routing: false
  use_rescore: false
  oversample_ratio: 2.0
  num_concurrency: "1,5,10,20"
  concurrency_duration: 30
  drop_old: true
  load: true
  search_serial: true
  search_concurrent: true

ossopensearch-50k:
  db_label: os_50k_docker
  host: localhost
  port: 9200
  user: admin
  password: admin
  case_type: Performance1536D50K
  k: 100
  m: 16
  ef_construction: 200
  ef_search: 100
  engine: faiss
  quantization_type: fp32
  number_of_shards: 1
  number_of_replicas: 0
  index_thread_qty: 4
  refresh_interval: "30s"
  force_merge_enabled: true
  num_concurrency: "1,5,10,20"
  concurrency_duration: 30
  drop_old: true
  load: true
  search_serial: true
  search_concurrent: true

